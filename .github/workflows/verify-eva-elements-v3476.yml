name: Verify BlaBla favorite item classification
on:
  push:
    branches:
      - verify-eva-elements-v3476
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser runtime dependency
        run: npm install --no-save --ignore-scripts puppeteer-core@24.17.0
      - name: Verify favorite item import semantics
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import {pathToFileURL} from 'node:url';
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--allow-file-access-from-files']});
          const page=await browser.newPage();
          page.on('pageerror',e=>console.error('PAGEERROR',e.message));
          await page.goto(pathToFileURL(path.resolve('index.html')).href,{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForFunction(()=>!!window.NIKKEV34610External?.importExternalRoster&&!!window.NIKKE_V26_ROSTER_API?.load,{timeout:30000});
          await new Promise(r=>setTimeout(r,1200));
          const result=await page.evaluate(async()=>{
            const mk=(tid,lv)=>({nameCode:5016,lv:705,grade:3,core:1,attractiveLv:30,skill1Lv:10,skill2Lv:9,ultiSkillLv:8,favoriteItemTid:tid,favoriteItemLv:lv,harmonyCubeTid:0,equipments:[],equipment:[],overload:[],overloadInfo:[]});
            const cases=[
              ['none',0,0],
              ['r_collectible',100001,15],
              ['sr_collectible',100002,15],
              ['favorite_phase1',200001,1],
              ['favorite_phase3',200001,3]
            ];
            const out={};
            for(const [label,tid,lv] of cases){
              await window.NIKKEV34610External.importExternalRoster({characters:[mk(tid,lv)]},`favorite-${label}`);
              const row=window.NIKKE_V26_ROSTER_API.load()?.characters?.poliTreasure||null;
              out[label]={tid,lv,favoriteItemPhase:row?.favoriteItemPhase,storedId:row?.id};
            }
            return out;
          });
          await browser.close();
          console.log('FAVORITE_IMPORT='+JSON.stringify(result));
          console.log('Favorite item classification inspection complete');
          NODE
