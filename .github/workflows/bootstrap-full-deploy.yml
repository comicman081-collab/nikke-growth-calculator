name: Bootstrap full V34.7.4 deploy package

on:
  push:
    branches:
      - deploy-v34-7-4-autosync

permissions:
  contents: write

jobs:
  import-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact Dropbox package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 'https://uc797a906c115b8a914a5c5adbff.dl.dropboxusercontent.com/cd/0/get/DG7LObSC7sZXnyz4l4sACgxSkFHr19uDoljAlWHfDsH9gKskokJzHEQzyJt52SkGPnSepl4bXAMF-RsXXi12QkjDr-hYtWdfwgfvGiiStQOQfscplseOp8YYHqSE9Aec7jqBf1G5nSJ-gOefYCrMpmk4tbq_9jlK-XQb-6UxOseAqA/file?c_luid=67d0560b' --output /tmp/nikke-deploy.zip
          echo '8ac17efb155d9fe3661b2d816fe882b3553d1ef22442730c6eddd40e0bd06308  /tmp/nikke-deploy.zip' | sha256sum --check --strict
          unzip -t /tmp/nikke-deploy.zip

      - name: Import complete package including backgrounds icons and BGM
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nikke-package
          mkdir -p /tmp/nikke-package
          unzip -q /tmp/nikke-deploy.zip -d /tmp/nikke-package
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/nikke-package/ ./
          test -f index.html
          test -f functions/api/blabla/sync.js
          test -f public/index.html
          echo '0a3c9d1479f5709cc5c87764331df743a6c09bc9e8357e46c226156a031d9741  index.html' | sha256sum --check --strict
          cmp --silent index.html public/index.html
          grep -q 'data:audio' index.html
          grep -Eq 'data:image/(png|webp|jpeg)' index.html

      - name: Commit imported deployment source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy V34.7.4 full AutoSync web package'
          git push origin HEAD:deploy-v34-7-4-autosync
