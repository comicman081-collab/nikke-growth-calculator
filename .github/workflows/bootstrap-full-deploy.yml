name: Bootstrap full V34.7.4 deploy package

on:
  push:
    branches:
      - deploy-v34-7-4-autosync

permissions:
  contents: write

jobs:
  import-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact Dropbox package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 'https://uc0a683a7bcb592f371f6c7f1e7b.dl.dropboxusercontent.com/cd/0/get/DG7RjM8GHRg4Oklgc4g8-10UQI8EiG8ShppOBF_rIm2poZ5Nzjsk7OUJpRo4LsDr8osYuIg1WG61TqMewzhfSUhYCATHCe7zx7Gwgx71kcI2auz3_sB2pjbm61sPUOxBH0JoTTP_Ns13ZWDCxPm7S4JttT8tYp1wD1gIs7fc3983UA/file?c_luid=67d0560b' --output /tmp/nikke-deploy.zip
          echo '8ac17efb155d9fe3661b2d816fe882b3553d1ef22442730c6eddd40e0bd06308  /tmp/nikke-deploy.zip' | sha256sum --check --strict
          unzip -t /tmp/nikke-deploy.zip

      - name: Import complete package including backgrounds icons and BGM
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
          unzip -o /tmp/nikke-deploy.zip -d .
          rm -f .github/workflows/bootstrap-full-deploy.yml
          test -f index.html
          test -f functions/api/blabla/sync.js
          test -f public/index.html
          echo '0a3c9d1479f5709cc5c87764331df743a6c09bc9e8357e46c226156a031d9741  index.html' | sha256sum --check --strict
          cmp --silent index.html public/index.html
          grep -q 'data:audio' index.html
          grep -Eq 'data:image/(png|webp|jpeg)' index.html

      - name: Commit imported deployment source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy V34.7.4 full AutoSync web package'
          git push origin HEAD:deploy-v34-7-4-autosync
