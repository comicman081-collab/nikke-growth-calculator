name: Verify deploy build

on:
  workflow_dispatch:

concurrency:
  group: nikke-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Verify HTML mirror
        run: cmp --silent index.html public/index.html
