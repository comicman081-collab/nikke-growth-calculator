name: Inspect favorite item import V34.7.7
on:
  push:
    branches:
      - fix-blabla-skill-signature-favorite-v3477
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect favorite master and state effect parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['function staticTables','async function staticTables','function optionMapFromEffects','optionMapFromEffects=','favorites?.[','FAVORITE','favorite_item_tid','favorite_item_lv']
          for term in terms:
              print('\n===== TERM',term,'=====')
              start=0; seen=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  seen+=1
                  print(f'--- occurrence {seen} @ {i} ---')
                  print(s[max(0,i-3500):min(len(s),i+8000)])
                  start=i+len(term)
                  if seen>=10: break
          PY
