name: Inspect favorite item import V34.7.7

on:
  workflow_dispatch:
  push:
    branches:
      - fix-blabla-skill-signature-favorite-v3477
    paths:
      - .github/workflows/inspect-favorite-import-v3477.yml
      - scripts/audit_favorite_v3477.py
      - scripts/extract_enikk_favorite_master_v3477.mjs

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract live ENIKK favorite master and app consumers
        run: node scripts/extract_enikk_favorite_master_v3477.mjs

      - name: Download and inspect ENIKK APK payloads
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o enikk.apk https://api.enikk.app/apks/ENIKK_v1.0.6.apk
          rm -rf enikk_unpacked
          unzip -q -o enikk.apk -d enikk_unpacked
          python3 scripts/audit_favorite_v3477.py enikk_unpacked

      - name: Commit reproducible audit evidence
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/enikk-favorite-*
          if git diff --cached --quiet; then
            echo "Audit evidence unchanged"
          else
            git commit -m "Record ENIKK favorite-item audit evidence"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: enikk-favorite-audit-v3477
          path: audit/enikk-favorite-*
          if-no-files-found: error
