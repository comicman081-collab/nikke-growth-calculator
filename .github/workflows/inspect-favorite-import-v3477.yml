name: Inspect favorite item import V34.7.7

on:
  workflow_dispatch:
  push:
    branches:
      - fix-blabla-skill-signature-favorite-v3477
    paths:
      - .github/workflows/inspect-favorite-import-v3477.yml
      - scripts/audit_favorite_v3477.py
      - scripts/extract_enikk_favorite_master_v3477.mjs
      - scripts/extract_app_favorite_consumer_v3477.mjs
      - scripts/crawl_enikk_favorite_phase_v3477.mjs
      - scripts/scrape_enikk_favorite_characters_v3477.mjs

concurrency:
  group: favorite-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract live ENIKK favorite master
        run: node scripts/extract_enikk_favorite_master_v3477.mjs

      - name: Crawl deployed ENIKK phase and skill evidence
        run: node scripts/crawl_enikk_favorite_phase_v3477.mjs

      - name: Resolve complete ENIKK favorite-character roster
        run: node scripts/scrape_enikk_favorite_characters_v3477.mjs

      - name: Extract compact app favorite-item consumer evidence
        run: node scripts/extract_app_favorite_consumer_v3477.mjs

      - name: Optionally inspect ENIKK APK payloads
        continue-on-error: true
        run: |
          set -euo pipefail
          if curl -L --fail --retry 2 -o enikk.apk https://api.enikk.app/apks/ENIKK_v1.0.6.apk; then
            rm -rf enikk_unpacked
            unzip -q -o enikk.apk -d enikk_unpacked
            python3 scripts/audit_favorite_v3477.py enikk_unpacked
          else
            printf '%s\n' '# ENIKK APK auxiliary audit' '' \
              '- Status: unavailable from `api.enikk.app` during this run.' \
              '- The live ENIKK favorite master audit completed independently and remains authoritative for this patch.' \
              > audit/enikk-favorite-apk-unavailable-v3477.md
          fi

      - name: Commit reproducible audit evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/enikk-favorite-*
          if git diff --cached --quiet; then
            echo "Audit evidence unchanged"
          else
            git commit -m "Record ENIKK favorite-item audit evidence"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enikk-favorite-audit-v3477
          path: audit/enikk-favorite-*
          if-no-files-found: error

      - name: Export checked source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nikke-v3477-source-snapshot
          path: |
            index.html
            public/index.html
            package.json
            package-lock.json
            functions
            scripts
            tests
            SHA256SUMS.txt
            GITHUB_DEPLOY_STATUS.md
          if-no-files-found: warn
