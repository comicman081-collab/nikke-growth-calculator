name: V34.7.8 source snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: nikke-v3478-source-snapshot
          path: |
            .github
            audit
            docs
            functions
            public
            scripts
            tests
            index.html
            package.json
            package-lock.json
            wrangler.worker.jsonc
            README.md
            GITHUB_DEPLOY_STATUS.md
            SHA256SUMS.txt
          if-no-files-found: error
