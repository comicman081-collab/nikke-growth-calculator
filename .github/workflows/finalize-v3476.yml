name: Finalize V34.7.6 nameCode authority release
on:
  push:
    branches:
      - audit-blabla-namecode-mapping
    paths:
      - .github/workflows/finalize-v3476.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize production files and permanent regression checks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'missing replacement anchor in {path}: {old[:80]}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          replace('package.json','"version": "34.7.5"','"version": "34.7.6"')
          replace('functions/api/blabla/sync.js',"const VERSION = '34.7.5';","const VERSION = '34.7.6';")
          replace('tests/verify-deploy-autosync.mjs',"console.log('V34.7.5 deploy autosync static/function verification: PASS');","console.log('V34.7.6 deploy autosync + nameCode authority verification: PASS');")

          test=Path('tests/verify-deploy-autosync.mjs')
          s=test.read_text(encoding='utf-8')
          anchor="assert.match(html, /NIKKEV3474DeployAutoSyncVerification/);\n"
          checks="""assert.match(html, /NIKKEV3474DeployAutoSyncVerification/);
          // BlaBla/ENIKK nameCode is the character identity authority. Display names may collide.
          assert.match(html, /NIKKEV3476NameCodeMapping/);
          assert.match(html, /id=idForNameCode\(row\.nameCode\)\|\|supplementalId\(row\.nameCode\)/);
          assert.match(html, /\"5118\":\"asukaShikinamiLangley\"/);
          assert.match(html, /\"5119\":\"reiAyanami\"/);
          assert.match(html, /\"5132\":\"reiAyanamiTentative\"/);
          assert.match(html, /\"5133\":\"asukaWille\"/);
          assert.match(html, /\"5016\":\"poliTreasure\"/);
          assert.match(html, /\"5045\":\"rosannaTreasure\"/);
          assert.match(html, /\"5120\":\"mariMakinami\"/);
          assert.match(html, /\"5122\":\"phantomTreasure\"/);
          assert.match(html, /\"5153\":\"jillValentine\"/);
          assert.doesNotMatch(html, /\"5069\":\"reiAyanami\"/);
          """
          if anchor not in s:
              raise SystemExit('test insertion anchor missing')
          test.write_text(s.replace(anchor,checks,1),encoding='utf-8')

          status=Path('GITHUB_DEPLOY_STATUS.md')
          st=status.read_text(encoding='utf-8').replace('**V34.7.5 BlaBla AutoSync**','**V34.7.6 BlaBla nameCode Authority AutoSync**')
          marker='- Central roster remains the single sink for external data, so Precision / My Roster / cubes / 5-team auto composition consume the same imported values.\n'
          if marker in st and 'nameCode is the authority key' not in st:
              st=st.replace(marker,marker+'- BlaBla/ENIKK `nameCode` is the authority key for character identity; BlaBla master names remain display metadata, so duplicate names such as Rei/Asuka variants cannot overwrite each other.\n')
          status.write_text(st,encoding='utf-8')
          PY

          rm -f \
            scripts/audit-name-mapping.mjs \
            scripts/audit-runtime-name-mapping.mjs \
            scripts/apply-v3476-namecode-patch.mjs \
            scripts/verify-v3476-namecode.mjs \
            .github/workflows/audit-name-mapping.yml \
            .github/workflows/apply-v3476-namecode.yml \
            .github/workflows/finalize-v3476.yml

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          tracked=['index.html','public/index.html','functions/api/blabla/sync.js','package.json','wrangler.worker.jsonc','README.md','GITHUB_DEPLOY_STATUS.md']
          old=Path('SHA256SUMS.txt').read_text(encoding='utf-8').splitlines()
          by_file={line.split('  ',1)[1]:line for line in old if '  ' in line}
          for f in tracked:
              digest=hashlib.sha256(Path(f).read_bytes()).hexdigest()
              by_file[f]=f'{digest}  {f}'
          order=tracked+[f for f in by_file if f not in tracked]
          Path('SHA256SUMS.txt').write_text('\n'.join(by_file[f] for f in order if f in by_file)+'\n',encoding='utf-8')
          PY

      - name: Verify clean production release
        run: |
          npm run check
          npm run build
          test "$(sha256sum index.html | cut -d' ' -f1)" = "$(sha256sum public/index.html | cut -d' ' -f1)"
          ! grep -q '"5069":"reiAyanami"' index.html
          grep -q '"5119":"reiAyanami"' index.html
          grep -q '"5132":"reiAyanamiTentative"' index.html
          grep -q '"5118":"asukaShikinamiLangley"' index.html
          grep -q '"5133":"asukaWille"' index.html
      - name: Commit final production branch
        run: |
          git config user.name "comicman081-collab"
          git config user.email "comicman081@gmail.com"
          git add -A
          git commit -m "Finalize V34.7.6 BlaBla nameCode authority release"
          git push origin HEAD:audit-blabla-namecode-mapping
