name: Verify Cloudflare production V34.7.9

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix-five-deck-stability-v3479
    paths:
      - .github/workflows/verify-cloudflare-production-v3479.yml
      - tests/verify-cloudflare-production-v3479.mjs
      - tests/verify-five-deck-stability-v3479.mjs
      - tests/verify-five-deck-stability-browser-v3479.mjs
      - functions/api/blabla/sync.js
      - scripts/build-cloudflare.mjs
      - index.html
      - public/index.html
      - package.json
      - package-lock.json
      - wrangler.worker.jsonc

concurrency:
  group: cloudflare-production-v3479-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRODUCTION_URL: https://nikke-growth-calculator.breezy-mum.workers.dev
  PUBLIC_PROFILE_URL: https://www.blablalink.com/shiftyspad/nikke-list?openid=MjkwODAtMTczODk5ODEwMzMzMTgwOTYwMDc=

jobs:
  source-and-live-preflight:
    name: Source, low-memory and live bridge preflight
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify source and build the Cloudflare Worker bundle
        run: |
          set -euo pipefail
          npm run check
          npm run build
          cmp --silent index.html public/index.html
          test -f dist-cloudflare/index.html
          grep -F 'id="v3479-five-deck-stability"' index.html
          grep -F 'run_worker_first' wrangler.worker.jsonc
          grep -F 'BLABLA_29080_GAME_TOKEN' wrangler.worker.jsonc
          grep -F 'BLABLA_29080_GAME_OPENID' wrangler.worker.jsonc
          grep -F '/api/blabla/sync' dist-cloudflare/index.html

      - name: Re-run low-memory synchronized-roster five-deck regression
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/verify-five-deck-stability-browser-v3479.mjs

      - name: Verify current Cloudflare origin and same-origin BlaBla bridge
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const productionUrl=process.env.PRODUCTION_URL.replace(/\/$/,'');
          const publicProfileUrl=process.env.PUBLIC_PROFILE_URL;
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

          async function request(url,init={},attempts=6){
            let lastError=null;
            for(let attempt=1;attempt<=attempts;attempt+=1){
              const controller=new AbortController();
              const timer=setTimeout(()=>controller.abort(),45_000);
              try{
                const response=await fetch(url,{
                  ...init,
                  headers:{
                    'cache-control':'no-cache',
                    'user-agent':'nikke-growth-calculator-v3479-cloudflare-preflight/1.0',
                    ...(init.headers||{}),
                  },
                  signal:controller.signal,
                });
                clearTimeout(timer);
                if(response.status>=500&&attempt<attempts){
                  lastError=new Error(`${url} returned HTTP ${response.status}`);
                  await sleep(attempt*5_000);
                  continue;
                }
                return response;
              }catch(error){
                clearTimeout(timer);
                lastError=error;
                if(attempt<attempts)await sleep(attempt*5_000);
              }
            }
            throw lastError||new Error(`request failed: ${url}`);
          }

          const rootResponse=await request(`${productionUrl}/?v3479-preflight=${Date.now()}`);
          const rootText=await rootResponse.text();
          const server=rootResponse.headers.get('server')||'';
          const cfRay=rootResponse.headers.get('cf-ray')||'';
          if(!rootResponse.ok)throw new Error(`production root HTTP ${rootResponse.status}`);
          if(!/cloudflare/i.test(server)&&!cfRay)throw new Error(`Cloudflare response headers missing: server=${server||'(none)'}`);
          if(!/<title[^>]*>/i.test(rootText)||!/NIKKE|니케/i.test(rootText))throw new Error('production root is not the calculator HTML');

          const bridgeResponse=await request(`${productionUrl}/api/blabla/sync`,{
            method:'POST',
            headers:{'content-type':'application/json',Origin:productionUrl,Referer:`${productionUrl}/`},
            body:JSON.stringify({profileUrl:publicProfileUrl,serverHint:'GLOBAL'}),
          });
          const bridgeText=await bridgeResponse.text();
          let payload=null;
          try{payload=JSON.parse(bridgeText);}catch(_){ }
          if(!bridgeResponse.ok)throw new Error(`Cloudflare BlaBla bridge HTTP ${bridgeResponse.status}: ${bridgeText.slice(0,800)}`);
          if(!payload||payload.ok!==true)throw new Error(`Cloudflare BlaBla bridge invalid: ${bridgeText.slice(0,800)}`);
          const areas=Array.isArray(payload.areas)?payload.areas:[];
          const characterCount=areas.reduce((sum,area)=>sum+(Array.isArray(area.characters)?area.characters.length:0),0);
          const detailCount=areas.reduce((sum,area)=>sum+(Array.isArray(area.details)?area.details.length:0),0);
          const returnedAreas=areas.map(area=>Number(area.area)).filter(Number.isFinite);
          const supported=new Set([81,82,83,84,85]);
          if(characterCount<1||detailCount<1)throw new Error(`Cloudflare BlaBla bridge returned incomplete roster: ${bridgeText.slice(0,800)}`);
          if(!returnedAreas.length||!returnedAreas.every(area=>supported.has(area)))throw new Error(`unsupported 29080 area: ${returnedAreas.join(',')}`);

          const result={
            checkedAtUtc:new Date().toISOString(),
            productionUrl,
            root:{status:rootResponse.status,server,cfRay,bytes:Buffer.byteLength(rootText),detectedVersion:rootText.match(/V?34\.7\.\d+/)?.[0]||null},
            bridge:{status:bridgeResponse.status,version:payload.version||null,characterCount,detailCount,areas:returnedAreas},
            pass:true,
          };
          fs.writeFileSync('V3479_CLOUDFLARE_PREFLIGHT.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3479-cloudflare-integration-preflight
          path: |
            V3479_CLOUDFLARE_PREFLIGHT.json
            V3479_FIVE_DECK_BROWSER_RESULTS.json
            dist-cloudflare/index.html
          if-no-files-found: error

  production-verification:
    name: Verify deployed V34.7.9 and live BlaBla bridge
    if: github.ref == 'refs/heads/main'
    needs: source-and-live-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for automatic Cloudflare production deployment and verify it
        env:
          CLOUDFLARE_PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
          BLABLA_PUBLIC_PROFILE: ${{ env.PUBLIC_PROFILE_URL }}
          CLOUDFLARE_LIVE_REPORT: V3479_CLOUDFLARE_RESULTS.json
        run: node tests/verify-cloudflare-production-v3479.mjs

      - name: Upload production verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3479-cloudflare-production-verification
          path: V3479_CLOUDFLARE_RESULTS.json
          if-no-files-found: error
