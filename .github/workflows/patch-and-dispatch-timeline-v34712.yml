name: Finalize and dispatch V34.7.12 timeline gate

on:
  push:
    branches:
      - timeline-v34712
    paths:
      - .github/workflows/patch-and-dispatch-timeline-v34712.yml

permissions:
  contents: write
  actions: write

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timeline-v34712
          fetch-depth: 0
      - name: Make the default-collapsed state explicit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/v34712-timeline-runtime.js')
          text=p.read_text('utf-8')
          old="function makeDetails(id,label){const d=root.document.createElement('details');d.id=id;"
          new="function makeDetails(id,label){const d=root.document.createElement('details');d.open=false;d.id=id;"
          if 'd.open=false;d.id=id;' not in text:
              assert old in text
              text=text.replace(old,new,1)
              p.write_text(text,'utf-8')
          PY
          node --check scripts/v34712-timeline-runtime.js
          grep -F "d.open=false;d.id=id;" scripts/v34712-timeline-runtime.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/v34712-timeline-runtime.js
          if ! git diff --cached --quiet; then
            git commit -m 'V34.7.12: make timeline panels explicitly default-collapsed'
            git push origin HEAD:timeline-v34712
          fi
      - name: Dispatch the canonical full regression gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-timeline-v34712.yml --ref timeline-v34712
