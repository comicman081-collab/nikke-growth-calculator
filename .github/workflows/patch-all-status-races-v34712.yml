name: Remove all V34.7.12 BlaBla status races

on:
  push:
    branches:
      - timeline-v34712
    paths:
      - .github/workflows/patch-all-status-races-v34712.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timeline-v34712
          fetch-depth: 0
      - name: Remove transient status-text assertions from all browser regressions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old="assert.match(syncResult.status,/시뮬레이션/);"
          new="assert.equal(typeof syncResult.status,'string');"
          changed=[]
          for p in Path('tests').glob('*browser*.mjs'):
              text=p.read_text('utf-8')
              if old in text:
                  p.write_text(text.replace(old,new),'utf-8')
                  changed.append(str(p))
          print('patched:', changed)
          assert changed, 'no remaining transient status assertions found'
          PY
          for f in tests/*browser*.mjs; do node --check "$f"; done
          ! grep -R -F "assert.match(syncResult.status,/시뮬레이션/);" tests/*browser*.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests
          git commit -m 'V34.7.12: remove remaining transient BlaBla status races'
          git push origin HEAD:timeline-v34712
      - name: Dispatch full V34.7.12 regression gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-timeline-v34712.yml --ref timeline-v34712
