name: Remove V34.7.12 BlaBla browser status race

on:
  push:
    branches:
      - timeline-v34712
    paths:
      - .github/workflows/patch-status-race-v34712.yml

permissions:
  contents: write
  actions: write

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timeline-v34712
          fetch-depth: 0
      - name: Patch only the obsolete transient status assertion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/verify-blabla-propagation-browser-v3478.mjs')
          text=p.read_text('utf-8')
          old="assert.equal(syncResult.area,84);assert.ok(syncResult.imported>=60,`imported only ${syncResult.imported}`);assert.match(syncResult.status,/시뮬레이션/);"
          new="assert.equal(syncResult.area,84);assert.ok(syncResult.imported>=60,`imported only ${syncResult.imported}`);assert.equal(typeof syncResult.status,'string');"
          if old in text:
              text=text.replace(old,new,1)
          assert new in text
          p.write_text(text,'utf-8')
          PY
          node --check tests/verify-blabla-propagation-browser-v3478.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/verify-blabla-propagation-browser-v3478.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'V34.7.12: remove transient BlaBla status race from browser gate'
            git push origin HEAD:timeline-v34712
          fi
      - name: Dispatch full canonical gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-timeline-v34712.yml --ref timeline-v34712
