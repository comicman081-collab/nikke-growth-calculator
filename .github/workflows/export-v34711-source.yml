name: Export V34.7.11 source snapshot

on:
  push:
    branches:
      - linked-roster-refresh-v34711
    paths:
      - .github/workflows/export-v34711-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: nikke-v34711-source
          path: |
            .github
            audit
            docs
            functions
            public
            scripts
            tests
            index.html
            package.json
            package-lock.json
            wrangler.worker.jsonc
            worker-entry.js
            GITHUB_DEPLOY_STATUS.md
            SHA256SUMS.txt
          if-no-files-found: warn
