name: Apply V34.7.6 nameCode authority patch
on:
  push:
    branches:
      - audit-blabla-namecode-mapping
    paths:
      - scripts/apply-v3476-namecode-patch.mjs
      - scripts/verify-v3476-namecode.mjs
      - .github/workflows/apply-v3476-namecode.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply V34.7.6 patch
        run: node scripts/apply-v3476-namecode-patch.mjs
      - name: Install runtime verifier dependency only
        run: npm install --no-save --ignore-scripts puppeteer-core@24.17.0
      - name: Verify actual browser import mapping
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/verify-v3476-namecode.mjs
      - name: Verify repository build
        run: npm run check
      - name: Verify Cloudflare split build
        run: npm run build
      - name: Commit verified generated files
        run: |
          git config user.name "comicman081-collab"
          git config user.email "comicman081@gmail.com"
          git add index.html public/index.html SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Apply V34.7.6 BlaBla nameCode authority mapping"
            git push origin HEAD:audit-blabla-namecode-mapping
          fi
