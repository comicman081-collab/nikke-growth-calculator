name: Manual production privacy-gate verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-v34712
  cancel-in-progress: true

env:
  PRODUCTION_URL: https://nikke-growth-calculator.breezy-mum.workers.dev

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the deployed public BlaBla privacy gate
        env:
          CLOUDFLARE_PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
          CLOUDFLARE_LIVE_REPORT: V34712_CLOUDFLARE_RESULTS.json
        run: node tests/verify-cloudflare-production-v34710.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v34712-cloudflare-production-verification
          path: V34712_CLOUDFLARE_RESULTS.json
          if-no-files-found: error
