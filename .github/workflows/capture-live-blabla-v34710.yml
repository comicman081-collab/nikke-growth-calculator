name: Capture live BlaBla roster V34.7.10

on:
  workflow_dispatch:
  push:
    branches:
      - fix-owned-roster-zero-v34710
    paths:
      - .github/workflows/capture-live-blabla-v34710.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture public live roster through production Worker
        env:
          ORIGIN: https://nikke-growth-calculator.breezy-mum.workers.dev
          PROFILE: https://www.blablalink.com/shiftyspad/nikke-list?openid=MjkwODAtMTczODk5ODEwMzMzMTgwOTYwMDc=
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --max-time 120 \
            -H 'content-type: application/json' \
            -H "Origin: $ORIGIN" \
            -H "Referer: $ORIGIN/" \
            --data "$(jq -nc --arg profile "$PROFILE" '{profileUrl:$profile,serverHint:"GLOBAL"}')" \
            "$ORIGIN/api/blabla/sync" > live-blabla-roster.json
          jq -e '.ok == true' live-blabla-roster.json >/dev/null

      - name: Capture current ENIKK character master
        run: |
          set -euo pipefail
          jq -nc '{query:"query V34710Characters { characters { id name_code name_localkey resource_id original_rare class element_id use_burst_skill corporation slug } }",variables:{}}' > enikk-query.json
          curl -L --fail --retry 5 --max-time 120 \
            -H 'content-type: application/json' \
            --data-binary @enikk-query.json \
            https://enikk.app/api/graphql > enikk-character-master-response.json
          jq -e '.data.characters | length > 100' enikk-character-master-response.json >/dev/null
          jq '.data.characters' enikk-character-master-response.json > enikk-character-master.json
          jq '{rosterVersion:input.version, rosterAreas:[input.areas[]|{area,characterCount:(.characters|length),detailCount:(.details|length)}], masterCount:($master|length)}' \
            --argfile input live-blabla-roster.json --argfile master enikk-character-master.json -n

      - uses: actions/upload-artifact@v4
        with:
          name: live-blabla-roster-v34710
          path: |
            live-blabla-roster.json
            enikk-character-master.json
          if-no-files-found: error
