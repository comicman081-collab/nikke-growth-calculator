name: Capture live BlaBla roster V34.7.10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture public live roster through production Worker
        env:
          ORIGIN: https://nikke-growth-calculator.breezy-mum.workers.dev
          PROFILE: https://www.blablalink.com/shiftyspad/nikke-list?openid=MjkwODAtMTczODk5ODEwMzMzMTgwOTYwMDc=
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --max-time 120 \
            -H 'content-type: application/json' \
            -H "Origin: $ORIGIN" \
            -H "Referer: $ORIGIN/" \
            --data "$(jq -nc --arg profile "$PROFILE" '{profileUrl:$profile,serverHint:"GLOBAL"}')" \
            "$ORIGIN/api/blabla/sync" > live-blabla-roster.json
          jq -e '.ok == true' live-blabla-roster.json >/dev/null

      - name: Capture current ENIKK character master
        run: |
          set -euo pipefail
          jq -nc '{query:"query V34710Characters { characters { name_code name_localkey resource_id original_rare class element_id use_burst_skill corporation } }",variables:{}}' > enikk-query.json
          curl -L --fail --retry 5 --max-time 120 \
            -H 'content-type: application/json' \
            --data-binary @enikk-query.json \
            https://enikk.app/api/graphql > enikk-character-master-response.json
          jq -e '.data.characters | length > 100' enikk-character-master-response.json >/dev/null
          jq '.data.characters' enikk-character-master-response.json > enikk-character-master.json
          python3 - <<'PY'
          import json
          roster=json.load(open('live-blabla-roster.json',encoding='utf-8'))
          master=json.load(open('enikk-character-master.json',encoding='utf-8'))
          summary={
            'rosterVersion':roster.get('version'),
            'rosterAreas':[{
              'area':area.get('area'),
              'characterCount':len(area.get('characters') or []),
              'detailCount':len(area.get('details') or []),
            } for area in roster.get('areas') or []],
            'masterCount':len(master),
          }
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          json.dump(summary,open('capture-summary.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: live-blabla-roster-v34710
          path: |
            live-blabla-roster.json
            enikk-character-master.json
            capture-summary.json
          if-no-files-found: error
