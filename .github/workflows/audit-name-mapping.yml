name: Audit BlaBla name mapping
on:
  push:
    branches:
      - audit-blabla-namecode-mapping
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit ENIKK names against app aliases
        run: node scripts/audit-name-mapping.mjs
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: name-mapping-audit
          path: audit-output/
          if-no-files-found: error
