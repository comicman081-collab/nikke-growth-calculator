name: Apply V34.7.12 unified damage timelines

on:
  workflow_dispatch:
  push:
    branches:
      - timeline-v34712
    paths:
      - .github/workflows/apply-timeline-v34712.yml
      - scripts/v34712-timeline-runtime.js

concurrency:
  group: apply-timeline-v34712-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate-test-and-publish-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Integrate V34.7.12 timeline runtime and advance inherited regressions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root=Path('.')
          runtime=(root/'scripts/v34712-timeline-runtime.js').read_text('utf-8')
          html_path=root/'index.html'
          html=html_path.read_text('utf-8')
          marker='<script id="v34712-unified-damage-timeline">'
          if marker not in html:
              assert '</body>' in html
              html=html.replace('</body>',marker+'\n'+runtime+'\n</script>\n</body>',1)
          html=html.replace('34.7.11','34.7.12')
          html_path.write_text(html,'utf-8')
          (root/'public/index.html').write_text(html,'utf-8')

          for rel in ['package.json','package-lock.json','functions/api/blabla/sync.js']:
              p=root/rel
              p.write_text(p.read_text('utf-8').replace('34.7.11','34.7.12'),'utf-8')

          for p in (root/'tests').glob('*.mjs'):
              text=p.read_text('utf-8')
              if '34.7.11' in text:
                  p.write_text(text.replace('34.7.11','34.7.12'),'utf-8')

          browser=root/'tests/verify-owned-roster-186-browser-v34710.mjs'
          text=browser.read_text('utf-8')
          text=text.replace('&&window.NIKKEV34711LinkedRosterRefresh','&&window.NIKKEV34711LinkedRosterRefresh&&window.NIKKEV34712UnifiedTimeline')
          insertion=r'''
          console.error('[stage] timeline-v34712-start');
          const timelineV34712=await evaluate(cdp,`(async()=>{
            const api=window.NIKKEV34712UnifiedTimeline;
            if(!api)throw new Error('NIKKEV34712UnifiedTimeline missing');
            const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
            const waitAudit=async(details,timeout=30000)=>{const start=performance.now();while(performance.now()-start<timeout){if(details.dataset.auditPass==='true')return true;if(details.querySelector('.v34712-error'))throw new Error(details.querySelector('.v34712-error').textContent);await wait(50);}throw new Error('timeline audit timeout '+details.id);};
            const rowInfo=details=>[...details.querySelectorAll('.v34712-damage-row')].map(row=>({name:row.querySelector('.v34712-damage-name')?.textContent?.trim()||'',damage:row.querySelector('.v34712-damage-value')?.textContent?.trim()||''}));
            const dimensions=details=>{const chart=details.querySelector('.v34712-timeline-chart')?.getBoundingClientRect(),panel=details.querySelector('.v34712-damage-panel')?.getBoundingClientRect();return{chartW:chart?.width||0,chartH:chart?.height||0,panelW:panel?.width||0,panelH:panel?.height||0};};

            const favorite=window.NIKKE_V3477_FAVORITE_VERIFY||{};
            const comboSel=document.getElementById('precisionBufferCombo');
            const originalCombo=comboSel?.value||'none';
            const comboChecks=[];
            if(comboSel){
              for(const option of [...comboSel.options]){
                comboSel.value=option.value;
                precisionCalcV21();
                const snapshot=window.__precisionSnapshot;
                const sim=api.syntheticFromSnapshot(snapshot);
                const audit=api.traceAudit(sim,api.normalizeTrace(sim));
                comboChecks.push({id:option.value,total:Number(snapshot?.totals?.combo||0),audit:!!audit.pass,finite:Number.isFinite(Number(snapshot?.totals?.combo))});
              }
              comboSel.value=originalCombo;
              precisionCalcV21();
            }

            document.querySelector('.tab[data-page="precision"]')?.click();
            await wait(40);
            const precision=document.getElementById('v34712PrecisionTimeline');
            precision.open=true;precision.dispatchEvent(new Event('toggle'));await waitAudit(precision);
            const pExpected=Number(window.__precisionSnapshot?.totals?.combo||0);
            const pRows=rowInfo(precision),pDims=dimensions(precision);
            const precisionCheck={audit:precision.dataset.auditPass==='true',total:Number(precision.dataset.total||0),expected:pExpected,rows:pRows,dimensions:pDims};
            precision.open=false;precision.dispatchEvent(new Event('toggle'));

            if(typeof soloRaidRefresh==='function')soloRaidRefresh(true);
            await wait(40);
            const solo=document.getElementById('v34712SoloTimeline');
            solo.open=true;solo.dispatchEvent(new Event('toggle'));await waitAudit(solo);
            let soloResult=null;try{soloResult=(typeof __soloRaidLastResult!=='undefined')?__soloRaidLastResult:null;}catch(_){ }
            const soloExpected=Number(soloResult?.combo?.total||0),soloRows=rowInfo(solo),soloDims=dimensions(solo);
            const soloCheck={audit:solo.dataset.auditPass==='true',total:Number(solo.dataset.total||0),expected:soloExpected,rows:soloRows,dimensions:soloDims};
            solo.open=false;solo.dispatchEvent(new Event('toggle'));

            document.querySelector('.tab[data-page="v26Optimizer"]')?.click();
            await wait(80);
            api.decorateFiveDeck();
            const deckPanels=[...document.querySelectorAll('.v34712-five-deck-timeline')].slice(0,5);
            const decks=[];
            for(let i=0;i<deckPanels.length;i++){
              const details=deckPanels[i];
              details.open=true;details.dispatchEvent(new Event('toggle'));await waitAudit(details,45000);
              const rows=rowInfo(details),dims=dimensions(details);
              const namesOk=rows.every(row=>{const n=row.name;if(n.endsWith('...'))return Array.from(n.slice(0,-3)).length===3;return Array.from(n).length<=3;});
              const damageOk=rows.every(row=>/^[0-9][0-9,.]*(?:조|억|만)?$/.test(row.damage));
              decks.push({index:i+1,audit:details.dataset.auditPass==='true',total:Number(details.dataset.total||0),rows,dimensions:dims,namesOk,damageOk,summary:details.querySelector('summary')?.textContent||''});
              details.open=false;details.dispatchEvent(new Event('toggle'));await wait(25);
            }

            const battleMount=document.getElementById('nikkeTimelineResult');
            let battleCheck={available:false};
            const result=window.NIKKEV34710LastResult||window.NIKKEV3420LastResult||window.NIKKEV340LastResult||window.NIKKEKitAwareLastResult;
            if(result?.teams?.[0]){
              const sim=api.simulateTeam(result.teams[0],result,0);
              window.NIKKESinglePartyTimelineLastResult=sim;
              if(battleMount)battleMount.textContent='timeline ready';
              await wait(80);
              const battle=document.getElementById('v34712BattleTimeline');
              battle.open=true;battle.dispatchEvent(new Event('toggle'));await waitAudit(battle);
              battleCheck={available:true,audit:battle.dataset.auditPass==='true',total:Number(battle.dataset.total||0),expected:Number(sim.totalDamage||0),rows:rowInfo(battle),dimensions:dimensions(battle)};
              battle.open=false;battle.dispatchEvent(new Event('toggle'));
            }
            return{runtime:api.verify(),favorite,comboChecks,precision:precisionCheck,solo:soloCheck,decks,battle:battleCheck,cacheSize:typeof api.cacheSize==='function'?api.cacheSize():null};
          })()`,300000);
          console.error('[stage] timeline-v34712-done',JSON.stringify({combos:timelineV34712.comboChecks.length,decks:timelineV34712.decks.length,cache:timelineV34712.cacheSize}));
          assert.equal(timelineV34712.runtime.pass,true,JSON.stringify(timelineV34712.runtime));
          assert.equal(timelineV34712.runtime.compactNameProbe,'신데렐...');
          assert.match(timelineV34712.runtime.damageProbe,/^12(?:\.0)?억$/);
          assert.equal(timelineV34712.favorite.pass,true,JSON.stringify(timelineV34712.favorite));
          assert.equal(Number(timelineV34712.favorite.characters),21,'favorite runtime count');
          assert.ok(timelineV34712.comboChecks.length>=30,`special combo count ${timelineV34712.comboChecks.length}`);
          assert.deepEqual(timelineV34712.comboChecks.filter(row=>!row.finite||!row.audit),[],'all special combo timeline totals/audits');
          assert.equal(timelineV34712.precision.audit,true,'precision timeline audit');
          assert.equal(timelineV34712.precision.total,timelineV34712.precision.expected,'precision exact total');
          assert.equal(timelineV34712.solo.audit,true,'solo raid timeline audit');
          assert.equal(timelineV34712.solo.total,timelineV34712.solo.expected,'solo raid exact total');
          assert.equal(timelineV34712.decks.length,5,'five deck timeline panels');
          for(const deck of timelineV34712.decks){
            assert.equal(deck.audit,true,`deck ${deck.index} timeline audit`);
            assert.equal(deck.rows.length,5,`deck ${deck.index} damage rows`);
            assert.equal(deck.namesOk,true,`deck ${deck.index} 3-glyph truncation`);
            assert.equal(deck.damageOk,true,`deck ${deck.index} compact damage labels`);
            assert.ok(deck.dimensions.chartW>deck.dimensions.panelW*4,`deck ${deck.index} graph must be much wider`);
            assert.ok(Math.abs(deck.dimensions.chartH-deck.dimensions.panelH)<=1,`deck ${deck.index} graph/panel same height`);
            assert.match(deck.summary,/타임라인/);
          }
          assert.equal(timelineV34712.battle.available,true,'battle timeline available');
          assert.equal(timelineV34712.battle.audit,true,'battle timeline audit');
          assert.equal(timelineV34712.battle.total,timelineV34712.battle.expected,'battle exact total');
          assert.equal(timelineV34712.battle.rows.length,5,'battle character damage rows');
          if(timelineV34712.cacheSize!==null)assert.ok(timelineV34712.cacheSize<=2,`bounded timeline cache ${timelineV34712.cacheSize}`);
          fs.writeFileSync(path.join(ROOT,'V34712_TIMELINE_BROWSER_RESULTS.json'),JSON.stringify({version:'34.7.12',verifiedAtUtc:new Date().toISOString(),...timelineV34712,pass:true},null,2)+'\n');
          '''
          marker='  const verification={version:VERSION,'
          if '[stage] timeline-v34712-start' not in text:
              assert marker in text
              text=text.replace(marker,insertion+'\n'+marker,1)
          browser.write_text(text,'utf-8')

          static=root/'tests/verify-timeline-v34712.mjs'
          static.write_text(r'''import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const html=fs.readFileSync(new URL('../index.html',import.meta.url),'utf8');
          const runtime=fs.readFileSync(new URL('../scripts/v34712-timeline-runtime.js',import.meta.url),'utf8');
          assert.equal((html.match(/id="v34712-unified-damage-timeline"/g)||[]).length,1,'one unified timeline runtime');
          assert.match(html,/V34\.7\.12/);
          assert.match(runtime,/minmax\(760px,1fr\) 150px/,'desktop graph must dominate damage panel');
          assert.match(runtime,/minmax\(690px,1fr\) 132px/,'mobile graph must dominate damage panel');
          assert.match(runtime,/glyphs\.slice\(0,3\).*'\.\.\.'/s,'3-glyph name truncation');
          assert.match(runtime,/n>=1e8/,'억 damage formatting');
          assert.match(runtime,/v34712PrecisionTimeline/);
          assert.match(runtime,/v34712SoloTimeline/);
          assert.match(runtime,/v34712BattleTimeline/);
          assert.match(runtime,/v34712-five-deck-timeline/);
          assert.match(runtime,/NIKKESinglePartyTimelineSimulator/,'five-deck must use existing simulator');
          assert.match(runtime,/CACHE_LIMIT=2/,'bounded on-demand five-deck trace cache');
          assert.match(runtime,/traceAudit/,'team/member/timeline total audit');
          assert.match(runtime,/details\.open=false|open=false/,'timeline panels default closed');
          console.log('V34.7.12 unified Precision / Raid / Battle / five-deck timeline static verification: PASS');
          ''','utf-8')

          pkg_path=root/'package.json'
          pkg=json.loads(pkg_path.read_text('utf-8'))
          check=pkg['scripts']['check']
          if 'verify-timeline-v34712.mjs' not in check:
              pkg['scripts']['check']=check+' && node tests/verify-timeline-v34712.mjs'
          pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n','utf-8')

          (root/'docs/V34.7.12_TIMELINES.md').write_text('''# V34.7.12 Unified Damage Timelines\n\n- Precision: default-collapsed timeline derived from the exact current precision result.\n- Raid simulation: default-collapsed timeline; no invented interruption/cover timing.\n- Battle timeline: exact existing single-party simulator output.\n- Five-deck: one default-collapsed per-team timeline, calculated on demand with the existing 180-second simulator.\n- Each five-deck timeline has a wide graph plus a same-height narrow vertical damage panel. Names longer than 3 glyphs are rendered as first 3 glyphs + `...`; damage uses Korean compact units (`억`, `조`).\n- Five-deck traces are cached at most two at a time and released on collapse/roster update to protect Android WebView memory.\n- The timeline renderer does not own damage coefficients. Favorite-item and special-combo authority remains in the existing calculators/simulator; timeline totals are audited against those exact results.\n''','utf-8')
          PY

          node --check scripts/v34712-timeline-runtime.js
          grep -F 'id="v34712-unified-damage-timeline"' index.html
          grep -F '34.7.12' package.json
          cmp --silent index.html public/index.html

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete static and calculation regression suite
        run: |
          set -euo pipefail
          : > V34712_RELEASE_RESULTS.txt
          npm run check | tee -a V34712_RELEASE_RESULTS.txt

      - name: Build Cloudflare assets
        run: npm run build | tee -a V34712_RELEASE_RESULTS.txt

      - name: Run all browser regressions including 193-row linked roster and timelines
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run check:browser | tee -a V34712_RELEASE_RESULTS.txt

      - name: Parse every executable inline script
        run: |
          set -euo pipefail
          node tests/verify-inline-v34710.mjs | tee -a V34712_RELEASE_RESULTS.txt

      - name: Record release hashes and timeline evidence
        run: |
          set -euo pipefail
          sha256sum index.html public/index.html scripts/v34712-timeline-runtime.js package.json package-lock.json functions/api/blabla/sync.js tests/verify-timeline-v34712.mjs tests/verify-owned-roster-186-browser-v34710.mjs > V34712_SHA256SUMS.txt
          test -s V34712_TIMELINE_BROWSER_RESULTS.json
          grep -F '"pass": true' V34712_TIMELINE_BROWSER_RESULTS.json

      - name: Commit canonical V34.7.12 source to branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html public/index.html package.json package-lock.json functions/api/blabla/sync.js tests scripts/v34712-timeline-runtime.js docs/V34.7.12_TIMELINES.md V34712_RELEASE_RESULTS.txt V34712_TIMELINE_BROWSER_RESULTS.json V34712_SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'No canonical V34.7.12 changes to commit'
          else
            git commit -m 'V34.7.12: add unified damage timelines and full damage regression'
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload verified V34.7.12 release candidate
        uses: actions/upload-artifact@v4
        with:
          name: nikke-v34712-timeline-verified
          path: |
            index.html
            public/index.html
            dist-cloudflare/index.html
            V34712_RELEASE_RESULTS.txt
            V34712_TIMELINE_BROWSER_RESULTS.json
            V34712_SHA256SUMS.txt
          if-no-files-found: error
