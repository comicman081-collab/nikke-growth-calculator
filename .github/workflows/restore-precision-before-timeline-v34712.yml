name: Restore V34.7.12 Precision before timeline audit

on:
  push:
    branches:
      - timeline-v34712
    paths:
      - .github/workflows/restore-precision-before-timeline-v34712.yml

permissions:
  contents: write
  actions: write

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timeline-v34712
          fetch-depth: 0
      - name: Restore linked Sugar Precision state immediately before injected timeline audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/verify-owned-roster-186-browser-v34710.mjs')
          text=p.read_text('utf-8')
          marker='  const verification={version:VERSION,'
          prelude="  await evaluate(cdp,`(()=>{NIKKE_V26_ROSTER_API.apply('sugarTreasure');precisionCalc();const s=window.__precisionSnapshot;return{total:s?.totals?.combo||s?.totals?.base||0};})()`);\n"
          assert marker in text
          if prelude not in text:
              text=text.replace(marker,prelude+marker,1)
          p.write_text(text,'utf-8')
          PY
          node --check tests/verify-owned-roster-186-browser-v34710.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/verify-owned-roster-186-browser-v34710.mjs
          git commit -m 'V34.7.12: restore authoritative Precision state before combo timeline audit'
          git push origin HEAD:timeline-v34712
      - name: Dispatch complete V34.7.12 gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-timeline-v34712.yml --ref timeline-v34712
