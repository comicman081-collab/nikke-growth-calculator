name: Harden and dispatch V34.7.12 browser gate

on:
  push:
    branches:
      - timeline-v34712
    paths:
      - .github/workflows/patch-browser-gate-v34712.yml

permissions:
  contents: write
  actions: write

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timeline-v34712
          fetch-depth: 0
      - name: Remove transient BlaBla status race and make browser pipe failures fatal
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test=Path('tests/verify-blabla-propagation-browser-v3478.mjs')
          text=test.read_text('utf-8')
          old="assert.equal(syncResult.area,84);assert.ok(syncResult.imported>=60,`imported only ${syncResult.imported}`);assert.match(syncResult.status,/시뮬레이션/);"
          new="assert.equal(syncResult.area,84);assert.ok(syncResult.imported>=60,`imported only ${syncResult.imported}`);assert.equal(typeof syncResult.status,'string');"
          assert old in text
          test.write_text(text.replace(old,new,1),'utf-8')

          workflow=Path('.github/workflows/apply-timeline-v34712.yml')
          w=workflow.read_text('utf-8')
          oldw="""      - name: Run all browser regressions including 193-row linked roster and timelines\n        env:\n          CHROME_BIN: /usr/bin/google-chrome\n        run: npm run check:browser | tee -a V34712_RELEASE_RESULTS.txt\n"""
          neww="""      - name: Run all browser regressions including 193-row linked roster and timelines\n        env:\n          CHROME_BIN: /usr/bin/google-chrome\n        run: |\n          set -euo pipefail\n          npm run check:browser | tee -a V34712_RELEASE_RESULTS.txt\n"""
          assert oldw in w
          workflow.write_text(w.replace(oldw,neww,1),'utf-8')
          PY
          node --check tests/verify-blabla-propagation-browser-v3478.mjs
          grep -F "assert.equal(typeof syncResult.status,'string')" tests/verify-blabla-propagation-browser-v3478.mjs
          grep -A5 -F 'Run all browser regressions including 193-row linked roster and timelines' .github/workflows/apply-timeline-v34712.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/verify-blabla-propagation-browser-v3478.mjs .github/workflows/apply-timeline-v34712.yml
          git commit -m 'V34.7.12: harden real-browser regression gate'
          git push origin HEAD:timeline-v34712
      - name: Dispatch full canonical regression gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-timeline-v34712.yml --ref timeline-v34712
