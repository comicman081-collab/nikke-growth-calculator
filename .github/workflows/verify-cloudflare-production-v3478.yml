name: Verify Cloudflare production V34.7.8

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - verify-blabla-propagation-v3478
    paths:
      - .github/workflows/verify-cloudflare-production-v3478.yml
      - tests/verify-cloudflare-production-v3478.mjs
      - tests/verify-blabla-propagation-v3478.mjs
      - tests/verify-blabla-propagation-browser-v3478.mjs
      - functions/api/blabla/sync.js
      - scripts/build-cloudflare.mjs
      - index.html
      - public/index.html
      - package.json
      - package-lock.json
      - wrangler.worker.jsonc

concurrency:
  group: cloudflare-production-v3478-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRODUCTION_URL: https://nikke-growth-calculator.breezy-mum.workers.dev
  PUBLIC_PROFILE_URL: https://www.blablalink.com/shiftyspad/nikke-list?openid=MjkwODAtMTczODk5ODEwMzMzMTgwOTYwMDc=

jobs:
  integration-preflight:
    name: Cloudflare integration preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Verify source and build the Worker asset bundle
        run: |
          set -euo pipefail
          npm run check
          npm run build
          cmp --silent index.html public/index.html
          test -f dist-cloudflare/index.html
          grep -F 'run_worker_first' wrangler.worker.jsonc
          grep -F 'BLABLA_29080_GAME_TOKEN' wrangler.worker.jsonc
          grep -F 'BLABLA_29080_GAME_OPENID' wrangler.worker.jsonc
          grep -F '/api/blabla/sync' dist-cloudflare/index.html

      - name: Verify current Cloudflare origin and same-origin BlaBla bridge
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const productionUrl = process.env.PRODUCTION_URL.replace(/\/$/, '');
          const publicProfileUrl = process.env.PUBLIC_PROFILE_URL;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function request(url, init = {}, attempts = 6) {
            let lastError = null;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 45_000);
              try {
                const response = await fetch(url, {
                  ...init,
                  headers: {
                    'cache-control': 'no-cache',
                    'user-agent': 'nikke-growth-calculator-v3478-cloudflare-preflight/1.0',
                    ...(init.headers || {}),
                  },
                  signal: controller.signal,
                });
                clearTimeout(timer);
                if (response.status >= 500 && attempt < attempts) {
                  lastError = new Error(`${url} returned HTTP ${response.status}`);
                  await sleep(attempt * 5_000);
                  continue;
                }
                return response;
              } catch (error) {
                clearTimeout(timer);
                lastError = error;
                if (attempt < attempts) await sleep(attempt * 5_000);
              }
            }
            throw lastError || new Error(`request failed: ${url}`);
          }

          const rootResponse = await request(`${productionUrl}/?v3478-preflight=${Date.now()}`);
          const rootText = await rootResponse.text();
          const server = rootResponse.headers.get('server') || '';
          const cfRay = rootResponse.headers.get('cf-ray') || '';
          if (!rootResponse.ok) throw new Error(`production root HTTP ${rootResponse.status}`);
          if (!/cloudflare/i.test(server) && !cfRay) throw new Error(`Cloudflare response headers missing: server=${server || '(none)'}`);
          if (!/<title[^>]*>/i.test(rootText) || !/NIKKE|니케/i.test(rootText)) throw new Error('production root is not the calculator HTML');

          const bridgeResponse = await request(`${productionUrl}/api/blabla/sync`, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              Origin: productionUrl,
              Referer: `${productionUrl}/`,
            },
            body: JSON.stringify({ profileUrl: publicProfileUrl, serverHint: 'GLOBAL' }),
          });
          const bridgeText = await bridgeResponse.text();
          let bridgePayload = null;
          try { bridgePayload = JSON.parse(bridgeText); } catch (_) {}
          if (!bridgeResponse.ok) {
            throw new Error(`Cloudflare BlaBla bridge HTTP ${bridgeResponse.status}: ${bridgeText.slice(0, 800)}`);
          }
          if (!bridgePayload || typeof bridgePayload !== 'object') throw new Error('Cloudflare BlaBla bridge did not return JSON');
          if (bridgePayload.ok !== true) throw new Error(`Cloudflare BlaBla bridge returned ok=false: ${bridgeText.slice(0, 800)}`);
          const areas = Array.isArray(bridgePayload.areas) ? bridgePayload.areas : [];
          const areaCharacterCount = areas.reduce((sum, area) => sum + (Array.isArray(area.characters) ? area.characters.length : 0), 0);
          const areaDetailCount = areas.reduce((sum, area) => sum + (Array.isArray(area.details) ? area.details.length : 0), 0);
          const roster = bridgePayload?.data?.roster || bridgePayload?.roster || bridgePayload?.data?.characters || bridgePayload?.characters;
          const fallbackRosterCount = Array.isArray(roster) ? roster.length : (roster && typeof roster === 'object' ? Object.keys(roster).length : 0);
          const rosterCount = Math.max(areaCharacterCount, fallbackRosterCount);
          if (rosterCount < 1 || (areas.length && areaDetailCount < 1)) {
            throw new Error(`Cloudflare BlaBla bridge returned incomplete roster data: ${bridgeText.slice(0, 800)}`);
          }

          const result = {
            checkedAtUtc: new Date().toISOString(),
            productionUrl,
            root: {
              status: rootResponse.status,
              server,
              cfRay,
              bytes: Buffer.byteLength(rootText),
              detectedVersion: rootText.match(/V?34\.7\.\d+/)?.[0] || null,
            },
            bridge: {
              status: bridgeResponse.status,
              server: bridgeResponse.headers.get('server') || '',
              cfRay: bridgeResponse.headers.get('cf-ray') || '',
              rosterCount,
              detailCount: areaDetailCount,
              areas: areas.map(area => Number(area.area)).filter(Number.isFinite),
              payloadVersion: bridgePayload.version || bridgePayload?.data?.version || null,
            },
            pass: true,
          };
          fs.writeFileSync('V3478_CLOUDFLARE_PREFLIGHT.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Upload integration preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3478-cloudflare-integration-preflight
          path: |
            V3478_CLOUDFLARE_PREFLIGHT.json
            V3478_PROPAGATION_RESULTS.txt
            dist-cloudflare/index.html
          if-no-files-found: error

  production-verification:
    name: Verify deployed V34.7.8 and live BlaBla propagation bridge
    if: github.ref == 'refs/heads/main'
    needs: integration-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for automatic Cloudflare production deployment and verify it
        env:
          CLOUDFLARE_PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
          BLABLA_PUBLIC_PROFILE: ${{ env.PUBLIC_PROFILE_URL }}
          CLOUDFLARE_LIVE_REPORT: V3478_CLOUDFLARE_RESULTS.json
        run: node tests/verify-cloudflare-production-v3478.mjs

      - name: Upload production verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3478-cloudflare-production-verification
          path: V3478_CLOUDFLARE_RESULTS.json
          if-no-files-found: error
