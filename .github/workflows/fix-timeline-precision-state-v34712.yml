name: Fix V34.7.12 timeline Precision state

on:
  push:
    branches:
      - timeline-v34712
    paths:
      - .github/workflows/fix-timeline-precision-state-v34712.yml

permissions:
  contents: write
  actions: write

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timeline-v34712
          fetch-depth: 0
      - name: Activate Precision and re-apply linked roster before combo audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-timeline-v34712.yml')
          text=p.read_text('utf-8')
          needle="""            const favorite=window.NIKKE_V3477_FAVORITE_VERIFY||{};\n            const comboSel=document.getElementById('precisionBufferCombo');\n"""
          replacement="""            const favorite=window.NIKKE_V3477_FAVORITE_VERIFY||{};\n            document.querySelector('.tab[data-page=\"precision\"]')?.click();\n            await wait(100);\n            NIKKE_V26_ROSTER_API.apply('sugarTreasure');\n            NIKKEV3475SyncPropagation.refreshPrecision();\n            precisionCalc();\n            const comboSel=document.getElementById('precisionBufferCombo');\n"""
          assert needle in text
          text=text.replace(needle,replacement,1)
          p.write_text(text,'utf-8')
          PY
          grep -A8 -F 'const favorite=window.NIKKE_V3477_FAVORITE_VERIFY' .github/workflows/apply-timeline-v34712.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/apply-timeline-v34712.yml
          git commit -m 'V34.7.12: restore active Precision state before special-combo timeline audit'
          git push origin HEAD:timeline-v34712
      - name: Dispatch full canonical V34.7.12 gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-timeline-v34712.yml --ref timeline-v34712
