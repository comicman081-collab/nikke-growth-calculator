name: Verify Cloudflare production V34.7.10

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix-owned-roster-zero-v34710
    paths:
      - .github/workflows/verify-cloudflare-production-v34710.yml
      - tests/verify-cloudflare-production-v34710.mjs
      - tests/verify-owned-roster-v34710.mjs
      - tests/verify-owned-roster-186-browser-v34710.mjs
      - scripts/v34710-owned-roster-repair.js
      - functions/api/blabla/sync.js
      - scripts/build-cloudflare.mjs
      - index.html
      - public/index.html
      - package.json
      - package-lock.json
      - wrangler.worker.jsonc

concurrency:
  group: cloudflare-production-v34710-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRODUCTION_URL: https://nikke-growth-calculator.breezy-mum.workers.dev
  PUBLIC_PROFILE_URL: https://www.blablalink.com/shiftyspad/nikke-list?openid=MjkwODAtMTczODk5ODEwMzMzMTgwOTYwMDc=

jobs:
  source-and-live-preflight:
    name: V34.7.10 source, 186-row and live bridge preflight
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify source and build Cloudflare assets
        run: |
          set -euo pipefail
          npm run check
          npm run build
          cmp --silent index.html public/index.html
          test -f dist-cloudflare/index.html
          grep -F 'id="v34710-owned-roster-repair"' index.html >/dev/null
          grep -F 'id="v34710-owned-roster-repair"' dist-cloudflare/index.html >/dev/null
          grep -F 'run_worker_first' wrangler.worker.jsonc >/dev/null
          grep -F 'BLABLA_29080_GAME_TOKEN' wrangler.worker.jsonc >/dev/null
          grep -F 'BLABLA_29080_GAME_OPENID' wrangler.worker.jsonc >/dev/null
          grep -F '/api/blabla/sync' dist-cloudflare/index.html >/dev/null

      - name: Re-run 186-row Android low-memory four-surface regression
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/verify-owned-roster-186-browser-v34710.mjs

      - name: Verify current Cloudflare origin and same-origin live BlaBla bridge
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --max-time 120 \
            -H 'content-type: application/json' \
            -H "Origin: $PRODUCTION_URL" \
            -H "Referer: $PRODUCTION_URL/" \
            --data "$(jq -nc --arg profile "$PUBLIC_PROFILE_URL" '{profileUrl:$profile,serverHint:"GLOBAL"}')" \
            "$PRODUCTION_URL/api/blabla/sync" > V34710_CLOUDFLARE_PREFLIGHT.json
          jq -e '.ok == true' V34710_CLOUDFLARE_PREFLIGHT.json >/dev/null
          jq -e '[.areas[].characters | length] | add >= 25' V34710_CLOUDFLARE_PREFLIGHT.json >/dev/null
          jq -e '[.areas[].details | length] | add >= 25' V34710_CLOUDFLARE_PREFLIGHT.json >/dev/null
          jq '{version,profile,areas:[.areas[]|{area,characters:(.characters|length),details:(.details|length),stateEffects:(.stateEffects|length)}]}' V34710_CLOUDFLARE_PREFLIGHT.json

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: v34710-cloudflare-integration-preflight
          path: |
            V34710_CLOUDFLARE_PREFLIGHT.json
            V34710_OWNED_ROSTER_186_BROWSER_RESULTS.json
            dist-cloudflare/index.html
          if-no-files-found: error

  production-verification:
    name: Verify deployed V34.7.10 and live BlaBla bridge
    if: github.ref == 'refs/heads/main'
    needs: source-and-live-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for automatic Cloudflare production deployment and verify it
        env:
          CLOUDFLARE_PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
          BLABLA_PUBLIC_PROFILE: ${{ env.PUBLIC_PROFILE_URL }}
          CLOUDFLARE_LIVE_REPORT: V34710_CLOUDFLARE_RESULTS.json
        run: node tests/verify-cloudflare-production-v34710.mjs

      - name: Upload production verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: v34710-cloudflare-production-verification
          path: V34710_CLOUDFLARE_RESULTS.json
          if-no-files-found: error
